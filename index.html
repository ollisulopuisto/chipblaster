    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"CHIPBLASTER","url":"https://chipblaster.sulopuis.to/","description":"Browse and play the High Voltage SID Collection in a hi-fi styled Commodore 64 music player for your browser.","applicationCategory":"MultimediaApplication","operatingSystem":"Any"}
    </script>
    <style>
      /* What is on screen until the app has loaded: the shape of the case, not a page of text. The text stays in the page for search engines and screen readers. */
      html,body{margin:0;background:#f4f1ea}
      .boot-case{box-sizing:border-box;width:min(calc(100vw - 12px),420px);height:min(78vh,820px);margin:15vh auto 0;border:2px solid #7d7358;border-radius:26px 26px 16px 16px;background:linear-gradient(90deg,#7a5232 0 9px,#d8cfb4 9px calc(100% - 9px),#7a5232 calc(100% - 9px));position:relative;box-shadow:0 8px 24px #0003}
      .boot-case::before{content:'';position:absolute;left:30%;right:30%;top:-34px;height:34px;border:6px solid #1c1c1a;border-bottom:0;border-radius:18px 18px 0 0}
      .boot-case::after{content:'';position:absolute;left:34px;right:34px;top:96px;height:46%;border-radius:10px;background:#101716;animation:boot-pulse 1.4s ease-in-out infinite alternate}
      @keyframes boot-pulse{from{opacity:.75}to{opacity:1}}
      .boot-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
      @media(prefers-reduced-motion:reduce){.boot-case::after{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <main>
        <div class="boot-case" aria-hidden="true"></div>
        <h1 class="boot-sr">CHIPBLASTER</h1>
        <p class="boot-sr">A portable SID station in your browser. Browse and play the High Voltage SID Collection through a hi-fi styled Commodore 64 music player.</p>
        <p class="boot-sr">Browse SID tunes, build a queue, save favorites, and listen in your browser.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
